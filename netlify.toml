# ============================================================================
# SkillForge — Netlify config (frontend + API function; database on Supabase)
#
# Netlify hosts BOTH the Next.js web app AND the Express API (as a serverless
# function). The database is Supabase. No Render.
#
# Required environment variables (Site settings -> Environment variables):
#   DATABASE_URL          Supabase pooler connection string
#   DIRECT_URL            Supabase session/direct connection string
#   JWT_ACCESS_SECRET     any long random string
#   JWT_REFRESH_SECRET    any long random string
#   NODE_ENV              production
#   NEXT_PUBLIC_API_URL   /api/v1
#   NEXT_PUBLIC_WEB3FORMS_KEY  your Web3Forms key
# ============================================================================

[build]
  base = "client"
  # Publish dir MUST differ from base (client) or @netlify/plugin-nextjs errors.
  # ".next" is relative to base -> client/.next (the Next build output).
  publish = ".next"
  # Install the server's deps (needed to bundle the API), then build client (which
  # bundles the API into a function + generates Prisma + builds Next.js).
  command = "cd ../server && npm install --no-audit --no-fund && cd ../client && npm run build"

[build.environment]
  # Frontend talks to the API same-origin (the /api/* redirect -> function).
  NEXT_PUBLIC_API_URL = "/api/v1"
  # Web3Forms is a public form-access key (safe to expose); powers the newsletter form.
  NEXT_PUBLIC_WEB3FORMS_KEY = "c03a7342-a0e7-44aa-869e-1dc50d67bc29"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  # Keep Prisma Client external and ship the generated client + engine alongside it.
  external_node_modules = ["@prisma/client", ".prisma/client"]
  included_files = ["node_modules/.prisma/client/**"]

# Route all API calls to the Express function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
